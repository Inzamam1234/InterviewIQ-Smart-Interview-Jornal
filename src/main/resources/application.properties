
spring.application.name=interviewjournal

server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewjournal}
spring.datasource.username=${DB_USERNAME:injamam}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging.level.org.springframework.security=INFO
